# Kural kapısı — PR açıldığında aynı denetim GitHub'da da koşar.
# Kural kopyası .kural/ altında durur; 'spark kural kur <proje>' tazeler.
name: kural kapısı
on:
  pull_request:
jobs:
  kapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: araçlar
        run: |
          python -m pip install -q ruff pytest
          sudo apt-get install -y -qq shellcheck
          [ -f requirements.txt ] && python -m pip install -q -r requirements.txt || true
      - name: kapı
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .kural/kural_kapisi.py pr --base "origin/${{ github.base_ref }}" --kurallar .kural
