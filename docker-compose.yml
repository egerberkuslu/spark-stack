# =============================================================================
#  spark-stack — dört model katmanı + kapı + ekstralar
#
#  PROFİLLER (bellek sığsın diye, hepsi aynı anda açılmaz):
#     demo   → haiku + sonnet            ~45 GB   en hızlı ayağa kalkan
#     daily  → haiku + sonnet + opus     ~65 GB   normal kullanım
#     fable  → fable tek başına         ~105 GB   en yüksek kalite
#     swap   → llama-swap                        katmanı istek anında açar
#     canvas → Agent Canvas                      ajan kontrol merkezi, otomasyonlar
#     a2a    → A2A köprüsü                        rolleri protokolle dışarı açar
#     extras → webui + qdrant                     ekip arayüzü, doküman arama
#     stt    → whisper                            ses → yazı
#
#  Doğrudan compose yerine "spark" komutunu kullan:  spark up daily
# =============================================================================

x-vllm: &vllm
  image: ${VLLM_IMAGE}
  restart: unless-stopped
  ipc: host
  ulimits: { memlock: -1, stack: 67108864 }
  environment:
    HF_HOME: /models/hf
    HF_TOKEN: ${HF_TOKEN}
    VLLM_ATTENTION_BACKEND: FLASHINFER
    # sm_121 (GB10): NVFP4 için Marlin şart, yoksa bozuk çıktı
    VLLM_NVFP4_GEMM_BACKEND: ${VLLM_NVFP4_GEMM_BACKEND:-marlin}
    VLLM_USE_FLASHINFER_MOE_FP4: ${VLLM_USE_FLASHINFER_MOE_FP4:-0}
  volumes:
    - ${AI_ROOT:-/srv/ai}/models:/models
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

x-health: &health
  interval: 30s
  timeout: 10s
  retries: 80
  start_period: 900s
  test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]

services:

  # ── kapı ──────────────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: sk-litellm
    profiles: [demo, daily, fable, swap, canvas, a2a, extras]
    restart: unless-stopped
    ports: ["${GATEWAY_BIND:-127.0.0.1}:4000:4000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${AI_ROOT:-/srv/ai}/compose/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health/liveliness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ── Agent Canvas · ajan kontrol merkezi ───────────────────────────────────
  #  OpenHands deposunun bugünkü hali. Konuşmalar, otomasyonlar (webhook +
  #  zamanlayıcı), dosyalar ve terminal tek yerden yönetilir.
  #
  #  Üç ayrıntı:
  #   1) Ajan bu kabın içinde koşar; makinenin dosya sistemini görmez, yalnız
  #      /projects altına bağladığımız klasörü görür. docker.sock GEREKMEZ.
  #   2) Claude Code, ACP alt ajanı olarak kabın içinde çalışabiliyor (sarmalayıcı
  #      imajda hazır geliyor). Onu da bizim kapımıza bağlıyoruz: ANTHROPIC_BASE_URL
  #      + ANTHROPIC_API_KEY. Abonelik OAuth token'ı BİLEREK verilmiyor — üst
  #      akış belgeleri, base URL ile token'ın birlikte kullanılamayacağını söylüyor.
  #   3) Kendi portu 8000, ama bizde 8000'i sonnet kullanıyor; dışarı CANVAS_PORT'tan
  #      açılır.
  canvas:
    image: ghcr.io/openhands/agent-canvas:${CANVAS_TAG:-1.19.0}
    container_name: sk-canvas
    profiles: [canvas]
    restart: unless-stopped
    user: "${CANVAS_UID:-1000}:${CANVAS_GID:-1000}"
    ports: ["${CANVAS_BIND:-127.0.0.1}:${CANVAS_PORT:-8300}:8000"]
    environment:
      OH_SECRET_KEY: ${OH_SECRET_KEY:-}
      LOCAL_BACKEND_API_KEY: ${CANVAS_KEY:-}
      AGENT_CANVAS_DISABLE_TELEMETRY: ${CANVAS_TELEMETRY_OFF:-1}
      # ACP alt ajanları (Claude Code) yerel kapıya baksın. Host'taki .bashrc
      # bloğuyla aynı ikili: bazı sürümler API_KEY, bazıları AUTH_TOKEN okuyor.
      ANTHROPIC_BASE_URL: http://litellm:4000
      ANTHROPIC_API_KEY: ${LITELLM_KEY:-sk-spark}
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_KEY:-sk-spark}
    volumes:
      - ${AI_ROOT:-/srv/ai}/data/canvas:/home/openhands/.openhands
      - ${CANVAS_PROJECTS:-/srv/ai/data/projects}:/projects
      # Bilgi tabanı SALT OKUNUR: ajan notlara bakabilsin ama silemesin.
      # Vault'a yazma, insanın onayladığı "wiki" akışında kalır.
      - ${OBSIDIAN_VAULT:-/srv/ai/data/vault}:/vault:ro
      # Kurallar ayrıca kullanıcı skill'i olarak bağlanır: tetikleyicisiz .md
      # dosyaları sistem istemine HER konuşmada tam metin giriyor. Yani kuralı
      # okumak ajanın insafına kalmıyor. Bütün vault değil, yalnız kurallar.
      - ${OBSIDIAN_VAULT:-/srv/ai/data/vault}/kurallar:/home/openhands/.agents/skills:ro

  # ── A2A köprüsü · rolleri protokolle dışarı aç ────────────────────────────
  #  Roller (spark-kod/test/denetci) Agent2Agent protokolüyle adreslenebilir
  #  hale gelir: keşif /.well-known/agent-card.json, gövde JSON-RPC 2.0.
  #  Böylece başka bir süreçteki ya da başka makinedeki bir ajan, SDK'ya bağlı
  #  kalmadan role görev verebilir.
  #
  #  Rol tanımı ve kurallar tek kaynaktan salt okunur bağlanır; sunucu her
  #  istekte kuralları sistem istemine ekler, yani uzaktan gelen görev de
  #  şirket kurallarına bağlı kalır. Bağımlılık yok, stdlib ile çalışır.
  a2a:
    image: python:3.12-alpine
    container_name: sk-a2a
    profiles: [a2a]
    restart: unless-stopped
    ports: ["${A2A_BIND:-127.0.0.1}:${A2A_PORT:-8400}:8400"]
    environment:
      A2A_ROLES_DIR: /roles
      A2A_RULES_DIR: /vault/kurallar
      A2A_GATEWAY_URL: http://litellm:4000/v1
      A2A_GATEWAY_KEY: ${LITELLM_KEY:-sk-spark}
      A2A_PORT: "8400"
      A2A_BASE_URL: ${A2A_BASE_URL:-http://localhost:8400}
    command: ["python", "/srv/server.py"]
    volumes:
      - ${AI_ROOT:-/srv/ai}/compose/a2a-server.py:/srv/server.py:ro
      - ${AI_ROOT:-/srv/ai}/data/canvas/agents:/roles:ro
      # Tüm bilgi tabanı salt okunur: uzaktan çağrılan rol de geçmiş kararlara
      # bakabilsin. Kurallar bunun içinde (/vault/kurallar).
      - ${OBSIDIAN_VAULT:-/srv/ai/data/vault}:/vault:ro

  # ── llama-swap · talep-güdümlü katman değişimi ────────────────────────────
  #  Kapı ile model sunucuları arasına girer. İstek bir katmana geldiğinde o
  #  katmanın konteynerini başlatır, grup kuralı gereği çakışanları durdurur,
  #  boşta kalanı ttl dolunca düşürür. "spark up fable" elle yazılmaz.
  #
  #  Üç ayrıntı, üçü de bilerek:
  #   1) Konteyner ağındadır (host ağı değil). Kapı ona "llamaswap:8080" ile,
  #      o da katmanlara "haiku:8000" gibi servis adlarıyla ulaşır; hiçbir
  #      port makineye açılmaz.
  #   2) llama-swap'in Docker API istemcisi YOK; komutu düz exec eder. Bu
  #      yüzden hem docker.sock hem de statik docker CLI ikilisi bağlanır
  #      (install.sh indirir: $AI_ROOT/bin/docker).
  #   3) Sokete root olmadan erişebilsin diye host'un docker grubu eklenir.
  llamaswap:
    image: ghcr.io/mostlygeek/llama-swap:${LLAMASWAP_TAG:-unified-cuda13}
    container_name: sk-llamaswap
    profiles: [swap]
    restart: unless-stopped
    group_add: ["${DOCKER_GID:-999}"]
    # Yalnız makinenin kendisine açılır; kapı ona zaten ağ içinden ulaşıyor.
    # Bu port sadece "spark swap" ve sağlık yoklaması için var. 8080 DEĞİL:
    # NemoClaw'ın OpenShell gateway'i o portu kendi varsayılanı olarak kullanıyor.
    ports: ["${SWAP_BIND:-127.0.0.1}:${SWAP_PORT:-8081}:8080"]
    volumes:
      - ${AI_ROOT:-/srv/ai}/compose/llamaswap.yaml:/etc/llama-swap/config/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AI_ROOT:-/srv/ai}/bin/docker:/usr/local/bin/docker:ro

  # ── haiku · Qwen3.6-35B-A3B · hızlı Qwen ──────────────────────────────────
  haiku:
    <<: *vllm
    container_name: sk-haiku
    profiles: [demo, daily]
    ports: ["127.0.0.1:8002:8000"]
    volumes:
      - ${AI_ROOT:-/srv/ai}/models:/models
      - ${AI_ROOT:-/srv/ai}/data/cache-haiku:/root/.cache/vllm
    command: >
      vllm serve /models/haiku --served-model-name haiku
      --host 0.0.0.0 --port 8000
      --max-model-len ${HAIKU_CTX:-65536}
      --gpu-memory-utilization ${HAIKU_MEM:-0.20}
      --max-num-seqs 8 --kv-cache-dtype fp8
      --moe-backend marlin
      --enable-prefix-caching --enable-auto-tool-choice
      --tool-call-parser hermes --reasoning-parser qwen3
    healthcheck: *health

  # ── sonnet · Nemotron-3.5-Lightning + DSpark · hızlı NVIDIA ───────────────
  #  Bayraklar NVIDIA model kartındaki resmi DGX Spark reçetesi.
  #  Mamba hibrit olduğu için prefix cache kapalı; prefill zaten çok hızlı.
  sonnet:
    <<: *vllm
    container_name: sk-sonnet
    profiles: [demo, daily]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ${AI_ROOT:-/srv/ai}/models:/models
      - ${AI_ROOT:-/srv/ai}/data/cache-sonnet:/root/.cache/vllm
    command: >
      vllm serve /models/sonnet --served-model-name sonnet
      --host 0.0.0.0 --port 8000
      --max-model-len ${SONNET_CTX:-131072}
      --gpu-memory-utilization ${SONNET_MEM:-0.18}
      --max-num-seqs 8
      --max-num-batched-tokens 10240
      --no-enable-prefix-caching
      --async-scheduling
      --mamba-backend flashinfer
      --speculative-config '{"model":"/models/sonnet-draft","num_speculative_tokens":5}'
      --reasoning-parser nemotron_v3
      --tool-call-parser qwen3_coder
      --enable-auto-tool-choice
    healthcheck: *health

  # ── opus · Qwen3.8-27B + MTP · Qwen kalite (varsayılan) ───────────────────
  #  Yoğun 27B; checkpoint'in kendi MTP modülü taslak olarak çalışır.
  opus:
    <<: *vllm
    container_name: sk-opus
    profiles: [daily]
    ports: ["127.0.0.1:8888:8000"]
    volumes:
      - ${AI_ROOT:-/srv/ai}/models:/models
      - ${AI_ROOT:-/srv/ai}/data/cache-opus:/root/.cache/vllm
    command: >
      vllm serve /models/opus --served-model-name opus
      --host 0.0.0.0 --port 8000
      --max-model-len ${OPUS_CTX:-131072}
      --gpu-memory-utilization ${OPUS_MEM:-0.20}
      --max-num-seqs 4 --kv-cache-dtype fp8
      --enable-prefix-caching --enable-auto-tool-choice
      --tool-call-parser hermes --reasoning-parser qwen3
      --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
    healthcheck: *health

  # ── fable · Nemotron-3-Super-120B-A12B · NVIDIA ağır · tek başına ─────────
  fable:
    <<: *vllm
    container_name: sk-fable
    profiles: [fable]
    ports: ["127.0.0.1:8001:8000"]
    volumes:
      - ${AI_ROOT:-/srv/ai}/models:/models
      - ${AI_ROOT:-/srv/ai}/data/cache-fable:/root/.cache/vllm
    command: >
      vllm serve /models/fable --served-model-name fable
      --host 0.0.0.0 --port 8000
      --max-model-len ${FABLE_CTX:-65536}
      --gpu-memory-utilization ${FABLE_MEM:-0.82}
      --max-num-seqs 2
      --mamba-backend flashinfer
      --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
      --reasoning-parser nemotron_v3
      --tool-call-parser qwen3_coder
      --enable-auto-tool-choice
    healthcheck:
      <<: *health
      retries: 120
      start_period: 1800s

  # ── ekstralar ─────────────────────────────────────────────────────────────
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sk-webui
    profiles: [extras]
    restart: unless-stopped
    ports: ["${WEBUI_BIND:-127.0.0.1}:3000:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:4000/v1
      OPENAI_API_KEY: ${LITELLM_KEY:-sk-spark}
    volumes:
      - ${AI_ROOT:-/srv/ai}/data/webui:/app/backend/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sk-qdrant
    profiles: [extras]
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - ${AI_ROOT:-/srv/ai}/data/qdrant:/qdrant/storage

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: sk-whisper
    profiles: [stt]
    restart: unless-stopped
    ports: ["127.0.0.1:9000:9000"]
    environment: { ASR_MODEL: large-v3, ASR_ENGINE: faster_whisper }
    volumes:
      - ${AI_ROOT:-/srv/ai}/models/whisper:/root/.cache
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
